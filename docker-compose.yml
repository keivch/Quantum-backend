name: quantum

services:
  mongo:
    image: mongo:7
    container_name: quantum-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - quantum-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/quantum-backend
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-cambiar_en_produccion_usar_valor_seguro}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - quantum-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: "../Quantum frontend"
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: quantum-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quantum-net

  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-seed
    environment:
      MONGODB_URI: mongodb://mongo:27017/quantum-backend
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@quantum.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-operador@quantum.com}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-Operador123!}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - quantum-net
    command: npm run seed
    profiles:
      - seed

networks:
  quantum-net:
    driver: bridge

volumes:
  mongo_data:
    name: quantum_mongo_data
